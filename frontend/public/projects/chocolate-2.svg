<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="ch2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ch2-bg)"/>
  <text x="400" y="50" text-anchor="middle" font-family="monospace" font-size="14" fill="#f59e0b">// export trends over time</text>
  <!-- grid -->
  <g stroke="#2a2a44" stroke-width="1">
    <line x1="80" y1="120" x2="720" y2="120"/>
    <line x1="80" y1="200" x2="720" y2="200"/>
    <line x1="80" y1="280" x2="720" y2="280"/>
    <line x1="80" y1="360" x2="720" y2="360"/>
  </g>
  <line x1="80" y1="400" x2="720" y2="400" stroke="#2a2a44" stroke-width="2"/>
  <!-- line series -->
  <polyline fill="none" stroke="#f59e0b" stroke-width="3"
    points="80,340 180,300 280,320 380,240 480,260 580,180 680,150"/>
  <polyline fill="none" stroke="#f97316" stroke-width="3"
    points="80,370 180,350 280,300 380,330 480,250 580,270 680,210"/>
  <!-- points -->
  <g fill="#facc15">
    <circle cx="80" cy="340" r="4"/><circle cx="180" cy="300" r="4"/><circle cx="280" cy="320" r="4"/>
    <circle cx="380" cy="240" r="4"/><circle cx="480" cy="260" r="4"/><circle cx="580" cy="180" r="4"/><circle cx="680" cy="150" r="4"/>
  </g>
  <g font-family="monospace" font-size="11" fill="#8b8b9a" text-anchor="middle">
    <text x="80" y="425">Jan</text><text x="180" y="425">Mar</text><text x="280" y="425">May</text>
    <text x="380" y="425">Jul</text><text x="480" y="425">Sep</text><text x="580" y="425">Nov</text><text x="680" y="425">Dec</text>
  </g>
  <text x="400" y="470" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b8b9a">3 dashboards · sales · markets · trends</text>
</svg>
