<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0a0a0f"/>
  <text x="400" y="60" text-anchor="middle" font-family="monospace" font-size="14" fill="#06b6d4">// AWS EC2 deploy</text>
  <!-- arch flow -->
  <g font-family="sans-serif">
    <rect x="60" y="200" width="140" height="80" rx="12" fill="#161628" stroke="#06b6d4" stroke-width="2"/>
    <text x="130" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#06b6d4">Users</text>
    <text x="130" y="254" text-anchor="middle" font-size="11" fill="#8b8b9a" font-family="monospace">200+ regs</text>

    <rect x="280" y="200" width="160" height="80" rx="12" fill="#161628" stroke="#10b981" stroke-width="2"/>
    <text x="360" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">Django</text>
    <text x="360" y="254" text-anchor="middle" font-size="11" fill="#8b8b9a" font-family="monospace">+ Gunicorn</text>

    <rect x="520" y="120" width="220" height="80" rx="12" fill="#161628" stroke="#f59e0b" stroke-width="2"/>
    <text x="630" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">AWS EC2</text>
    <text x="630" y="174" text-anchor="middle" font-size="11" fill="#8b8b9a" font-family="monospace">t2.micro · ubuntu</text>

    <rect x="520" y="280" width="220" height="80" rx="12" fill="#161628" stroke="#ec4899" stroke-width="2"/>
    <text x="630" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#ec4899">SQLite + Static</text>
    <text x="630" y="334" text-anchor="middle" font-size="11" fill="#8b8b9a" font-family="monospace">nginx · whitenoise</text>

    <line x1="200" y1="240" x2="280" y2="240" stroke="#06b6d4" stroke-width="2" marker-end="url(#a)"/>
    <line x1="440" y1="220" x2="520" y2="170" stroke="#10b981" stroke-width="2"/>
    <line x1="440" y1="260" x2="520" y2="310" stroke="#ec4899" stroke-width="2"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#06b6d4"/>
    </marker>
  </defs>
  <text x="400" y="430" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b8b9a">dashboard p95 &lt; 800ms</text>
</svg>
