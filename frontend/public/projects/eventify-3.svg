<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0a0a0f"/>
  <rect x="40" y="40" width="720" height="420" rx="14" fill="#161628" stroke="#2a2a44"/>
  <!-- sidebar -->
  <rect x="40" y="40" width="180" height="420" rx="14" fill="#0f0f1c"/>
  <text x="60" y="80" font-family="sans-serif" font-size="16" font-weight="700" fill="#06b6d4">Eventify</text>
  <g font-family="monospace" font-size="12" fill="#8b8b9a">
    <rect x="56" y="110" width="148" height="32" rx="6" fill="#06b6d4" opacity="0.2"/>
    <text x="70" y="130" fill="#06b6d4">▸ Dashboard</text>
    <text x="70" y="170">  Events</text>
    <text x="70" y="200">  Registrations</text>
    <text x="70" y="230">  Users</text>
    <text x="70" y="260">  Roles</text>
    <text x="70" y="290">  Reports</text>
    <text x="70" y="320">  Settings</text>
  </g>
  <!-- main -->
  <text x="250" y="80" font-family="sans-serif" font-size="18" font-weight="700" fill="#e5e5ef">Dashboard</text>
  <text x="250" y="100" font-family="monospace" font-size="11" fill="#8b8b9a">role: admin</text>
  <!-- stat cards -->
  <g font-family="sans-serif">
    <rect x="240" y="120" width="150" height="90" rx="10" fill="#0f0f1c" stroke="#06b6d4"/>
    <text x="252" y="145" font-family="monospace" font-size="11" fill="#8b8b9a">EVENTS</text>
    <text x="252" y="180" font-size="28" font-weight="800" fill="#06b6d4">20+</text>
    <rect x="405" y="120" width="150" height="90" rx="10" fill="#0f0f1c" stroke="#10b981"/>
    <text x="417" y="145" font-family="monospace" font-size="11" fill="#8b8b9a">REGISTRATIONS</text>
    <text x="417" y="180" font-size="28" font-weight="800" fill="#10b981">200+</text>
    <rect x="570" y="120" width="150" height="90" rx="10" fill="#0f0f1c" stroke="#ec4899"/>
    <text x="582" y="145" font-family="monospace" font-size="11" fill="#8b8b9a">AVG LOAD</text>
    <text x="582" y="180" font-size="28" font-weight="800" fill="#ec4899">800ms</text>
  </g>
  <!-- table -->
  <g font-family="monospace" font-size="11">
    <rect x="240" y="240" width="480" height="36" rx="6" fill="#1a1a2e"/>
    <text x="252" y="262" fill="#8b8b9a">EVENT</text>
    <text x="430" y="262" fill="#8b8b9a">DATE</text>
    <text x="560" y="262" fill="#8b8b9a">STATUS</text>
    <text x="660" y="262" fill="#8b8b9a">REGS</text>
    <text x="252" y="298" fill="#e5e5ef">CodeFest 2026</text>
    <text x="430" y="298" fill="#8b8b9a">May 25</text>
    <text x="560" y="298" fill="#10b981">● open</text>
    <text x="660" y="298" fill="#06b6d4">128</text>
    <text x="252" y="328" fill="#e5e5ef">AI/ML Bootcamp</text>
    <text x="430" y="328" fill="#8b8b9a">Jun 02</text>
    <text x="560" y="328" fill="#10b981">● open</text>
    <text x="660" y="328" fill="#06b6d4">76</text>
    <text x="252" y="358" fill="#e5e5ef">Rhapsody Night</text>
    <text x="430" y="358" fill="#8b8b9a">Jun 10</text>
    <text x="560" y="358" fill="#f59e0b">● filling</text>
    <text x="660" y="358" fill="#06b6d4">204</text>
    <text x="252" y="388" fill="#e5e5ef">CS Symposium</text>
    <text x="430" y="388" fill="#8b8b9a">Jun 20</text>
    <text x="560" y="388" fill="#8b8b9a">● draft</text>
    <text x="660" y="388" fill="#06b6d4">—</text>
  </g>
  <text x="740" y="442" text-anchor="end" font-family="monospace" font-size="11" fill="#06b6d4" opacity="0.6">deployed on AWS EC2</text>
</svg>
