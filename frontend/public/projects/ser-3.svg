<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0a0a0f"/>
  <rect x="40" y="40" width="720" height="420" rx="14" fill="#161628" stroke="#2a2a44"/>
  <rect x="40" y="40" width="720" height="36" rx="14" fill="#1f1f33"/>
  <circle cx="62" cy="58" r="6" fill="#ff5f57"/>
  <circle cx="82" cy="58" r="6" fill="#febc2e"/>
  <circle cx="102" cy="58" r="6" fill="#28c840"/>
  <text x="400" y="62" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b8b9a">model.py</text>
  <g font-family="monospace" font-size="13">
    <text x="60" y="110" fill="#8b8b9a">1</text>
    <text x="90" y="110" fill="#ec4899">class</text>
    <text x="150" y="110" fill="#06b6d4">EmotionCNN</text>
    <text x="245" y="110" fill="#e5e5ef">(nn.Module):</text>
    <text x="60" y="140" fill="#8b8b9a">2</text>
    <text x="120" y="140" fill="#ec4899">def</text>
    <text x="160" y="140" fill="#facc15">__init__</text>
    <text x="230" y="140" fill="#e5e5ef">(self):</text>
    <text x="60" y="170" fill="#8b8b9a">3</text>
    <text x="180" y="170" fill="#e5e5ef">self.conv = nn.Conv2d(1, 32, 3)</text>
    <text x="60" y="200" fill="#8b8b9a">4</text>
    <text x="180" y="200" fill="#e5e5ef">self.pool = nn.MaxPool2d(2)</text>
    <text x="60" y="230" fill="#8b8b9a">5</text>
    <text x="180" y="230" fill="#e5e5ef">self.fc   = nn.Linear(128, </text>
    <text x="430" y="230" fill="#facc15">7</text>
    <text x="440" y="230" fill="#e5e5ef">)</text>
    <text x="60" y="260" fill="#8b8b9a">6</text>
    <text x="60" y="290" fill="#8b8b9a">7</text>
    <text x="120" y="290" fill="#ec4899">def</text>
    <text x="160" y="290" fill="#facc15">forward</text>
    <text x="225" y="290" fill="#e5e5ef">(self, mel):</text>
    <text x="60" y="320" fill="#8b8b9a">8</text>
    <text x="180" y="320" fill="#ec4899">return</text>
    <text x="245" y="320" fill="#e5e5ef">self.fc(self.pool(...))</text>
    <text x="60" y="410" fill="#8b8b9a"># 7 emotions · ~80% test accuracy</text>
  </g>
