<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0a0a0f"/>
  <rect x="40" y="40" width="720" height="420" rx="14" fill="#161628" stroke="#2a2a44"/>
  <rect x="40" y="40" width="720" height="36" rx="14" fill="#1f1f33"/>
  <circle cx="62" cy="58" r="6" fill="#ff5f57"/>
  <circle cx="82" cy="58" r="6" fill="#febc2e"/>
  <circle cx="102" cy="58" r="6" fill="#28c840"/>
  <text x="400" y="62" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b8b9a">paperrepo / urls.py</text>
  <g font-family="monospace" font-size="13">
    <text x="60" y="110" fill="#8b8b9a">1</text>
    <text x="90" y="110" fill="#ec4899">from</text>
    <text x="140" y="110" fill="#e5e5ef">django.urls</text>
    <text x="240" y="110" fill="#ec4899">import</text>
    <text x="300" y="110" fill="#e5e5ef">path</text>
    <text x="60" y="140" fill="#8b8b9a">2</text>
    <text x="90" y="140" fill="#ec4899">from</text>
    <text x="140" y="140" fill="#e5e5ef">.</text>
    <text x="150" y="140" fill="#ec4899">import</text>
    <text x="210" y="140" fill="#06b6d4">views</text>
    <text x="60" y="180" fill="#8b8b9a">3</text>
    <text x="60" y="210" fill="#8b8b9a">4</text>
    <text x="90" y="210" fill="#e5e5ef">urlpatterns = [</text>
    <text x="60" y="240" fill="#8b8b9a">5</text>
    <text x="120" y="240" fill="#e5e5ef">path(</text>
    <text x="170" y="240" fill="#a5d6a7">'/'</text>
    <text x="200" y="240" fill="#e5e5ef">, views.home, name=</text>
    <text x="370" y="240" fill="#a5d6a7">'home'</text>
    <text x="415" y="240" fill="#e5e5ef">),</text>
    <text x="60" y="270" fill="#8b8b9a">6</text>
    <text x="120" y="270" fill="#e5e5ef">path(</text>
    <text x="170" y="270" fill="#a5d6a7">'papers/'</text>
    <text x="245" y="270" fill="#e5e5ef">, views.paper_list),</text>
    <text x="60" y="300" fill="#8b8b9a">7</text>
    <text x="120" y="300" fill="#e5e5ef">path(</text>
    <text x="170" y="300" fill="#a5d6a7">'upload/'</text>
    <text x="245" y="300" fill="#e5e5ef">, views.upload, name=</text>
    <text x="430" y="300" fill="#a5d6a7">'upload'</text>
    <text x="490" y="300" fill="#e5e5ef">),</text>
    <text x="60" y="330" fill="#8b8b9a">8</text>
    <text x="120" y="330" fill="#e5e5ef">path(</text>
    <text x="170" y="330" fill="#a5d6a7">'search/'</text>
    <text x="245" y="330" fill="#e5e5ef">, views.search),</text>
    <text x="60" y="360" fill="#8b8b9a">9</text>
    <text x="90" y="360" fill="#e5e5ef">]</text>
    <text x="60" y="410" fill="#8b8b9a"># 1,500+ active users</text>
