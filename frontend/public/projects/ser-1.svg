<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="ser-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ser-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ser-bg)"/>
  <rect x="40" y="40" width="720" height="420" rx="18" fill="url(#ser-card)" opacity="0.95"/>
  <rect x="60" y="60" width="260" height="14" rx="7" fill="#06b6d4"/>
  <rect x="60" y="86" width="340" height="10" rx="5" fill="#8b8b9a" opacity="0.7"/>
  <!-- waveform -->
  <g stroke="#10b981" stroke-width="3" stroke-linecap="round">
    <line x1="70"  y1="170" x2="70"  y2="190"/>
    <line x1="90"  y1="150" x2="90"  y2="210"/>
    <line x1="110" y1="120" x2="110" y2="240"/>
    <line x1="130" y1="140" x2="130" y2="220"/>
    <line x1="150" y1="100" x2="150" y2="260"/>
    <line x1="170" y1="160" x2="170" y2="200"/>
    <line x1="190" y1="130" x2="190" y2="230"/>
    <line x1="210" y1="110" x2="210" y2="250"/>
    <line x1="230" y1="150" x2="230" y2="210"/>
    <line x1="250" y1="125" x2="250" y2="235"/>
    <line x1="270" y1="145" x2="270" y2="215"/>
    <line x1="290" y1="105" x2="290" y2="255"/>
    <line x1="310" y1="165" x2="310" y2="195"/>
    <line x1="330" y1="135" x2="330" y2="225"/>
  </g>
  <text x="70" y="300" font-family="monospace" font-size="13" fill="#8b8b9a">raw audio clip (1 of 1,400+)</text>
  <!-- emotion bars -->
  <g font-family="sans-serif" font-size="12">
    <text x="430" y="130" fill="#8b8b9a">Happy</text>
    <rect x="510" y="118" width="170" height="14" rx="7" fill="#10b981"/>
    <text x="430" y="165" fill="#8b8b9a">Angry</text>
    <rect x="510" y="153" width="60" height="14" rx="7" fill="#06b6d4"/>
    <text x="430" y="200" fill="#8b8b9a">Sad</text>
    <rect x="510" y="188" width="40" height="14" rx="7" fill="#06b6d4"/>
    <text x="430" y="235" fill="#8b8b9a">Neutral</text>
    <rect x="510" y="223" width="30" height="14" rx="7" fill="#06b6d4"/>
  </g>
  <g font-family="monospace" fill="#8b8b9a" font-size="11">
    <text x="60" y="380">DATASET</text>
    <text x="60" y="402" font-size="22" font-weight="700" fill="#06b6d4">1,400+</text>
  </g>
  <g font-family="monospace" fill="#8b8b9a" font-size="11">
    <text x="260" y="380">CLASSES</text>
    <text x="260" y="402" font-size="22" font-weight="700" fill="#10b981">7</text>
  </g>
  <g font-family="monospace" fill="#8b8b9a" font-size="11">
    <text x="460" y="380">ACCURACY</text>
    <text x="460" y="402" font-size="22" font-weight="700" fill="#10b981">~80%</text>
  </g>
  <text x="740" y="440" text-anchor="end" font-family="monospace" font-size="12" fill="#06b6d4" opacity="0.7">Speech Emotion · PyTorch + Librosa</text>
</svg>
