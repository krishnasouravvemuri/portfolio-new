<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="40" y="40" width="720" height="420" rx="18" fill="url(#card)" opacity="0.95"/>
  <!-- header -->
  <rect x="60" y="60" width="220" height="14" rx="7" fill="#7c3aed"/>
  <rect x="60" y="86" width="380" height="10" rx="5" fill="#8b8b9a" opacity="0.7"/>
  <!-- search bar -->
  <rect x="60" y="120" width="500" height="40" rx="20" fill="#1f1f33" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="85" cy="140" r="7" stroke="#06b6d4" stroke-width="2" fill="none"/>
  <line x1="91" y1="146" x2="98" y2="153" stroke="#06b6d4" stroke-width="2"/>
  <text x="110" y="146" font-family="monospace" font-size="14" fill="#8b8b9a">search 500+ papers…</text>
  <rect x="580" y="120" width="160" height="40" rx="10" fill="#7c3aed"/>
  <text x="660" y="146" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">Upload</text>
  <!-- paper cards -->
  <g font-family="sans-serif">
    <g>
      <rect x="60" y="190" width="220" height="120" rx="12" fill="#161628" stroke="#2a2a44"/>
      <rect x="76" y="208" width="48" height="56" rx="4" fill="#7c3aed" opacity="0.3"/>
      <rect x="76" y="208" width="48" height="8" fill="#7c3aed"/>
      <rect x="140" y="210" width="120" height="10" rx="3" fill="#e5e5ef"/>
      <rect x="140" y="228" width="90" height="8" rx="3" fill="#8b8b9a"/>
      <rect x="76" y="280" width="60" height="16" rx="8" fill="#06b6d4" opacity="0.3"/>
      <text x="106" y="292" font-size="10" fill="#06b6d4" text-anchor="middle">AI/ML</text>
    </g>
    <g transform="translate(250,0)">
      <rect x="60" y="190" width="220" height="120" rx="12" fill="#161628" stroke="#2a2a44"/>
      <rect x="76" y="208" width="48" height="56" rx="4" fill="#ec4899" opacity="0.3"/>
      <rect x="76" y="208" width="48" height="8" fill="#ec4899"/>
      <rect x="140" y="210" width="120" height="10" rx="3" fill="#e5e5ef"/>
      <rect x="140" y="228" width="90" height="8" rx="3" fill="#8b8b9a"/>
      <rect x="76" y="280" width="80" height="16" rx="8" fill="#ec4899" opacity="0.3"/>
      <text x="116" y="292" font-size="10" fill="#ec4899" text-anchor="middle">Networks</text>
    </g>
    <g transform="translate(500,0)">
      <rect x="60" y="190" width="220" height="120" rx="12" fill="#161628" stroke="#2a2a44"/>
      <rect x="76" y="208" width="48" height="56" rx="4" fill="#06b6d4" opacity="0.3"/>
      <rect x="76" y="208" width="48" height="8" fill="#06b6d4"/>
      <rect x="140" y="210" width="120" height="10" rx="3" fill="#e5e5ef"/>
      <rect x="140" y="228" width="90" height="8" rx="3" fill="#8b8b9a"/>
      <rect x="76" y="280" width="60" height="16" rx="8" fill="#06b6d4" opacity="0.3"/>
      <text x="106" y="292" font-size="10" fill="#06b6d4" text-anchor="middle">Systems</text>
    </g>
  </g>
  <!-- stats footer -->
  <g font-family="monospace" fill="#8b8b9a" font-size="11">
    <text x="60" y="380">DOWNLOADS</text>
    <text x="60" y="402" font-size="22" font-weight="700" fill="#06b6d4">2,000+</text>
  </g>
  <g font-family="monospace" fill="#8b8b9a" font-size="11">
    <text x="260" y="380">USERS</text>
    <text x="260" y="402" font-size="22" font-weight="700" fill="#7c3aed">1,500+</text>
  </g>
  <g font-family="monospace" fill="#8b8b9a" font-size="11">
    <text x="460" y="380">LOAD</text>
    <text x="460" y="402" font-size="22" font-weight="700" fill="#ec4899">&lt; 1s</text>
  </g>
  <text x="740" y="440" text-anchor="end" font-family="monospace" font-size="12" fill="#7c3aed" opacity="0.7">PaperRepo · DRF + React</text>
</svg>
