<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="gs2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#gs2-bg)"/>
  <text x="400" y="50" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">// retrieval pipeline</text>
  <!-- flow nodes -->
  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <rect x="60"  y="200" width="130" height="70" rx="12" fill="#161628" stroke="#7c3aed"/>
    <text x="125" y="230" fill="#e5e5ef">Repo files</text>
    <text x="125" y="250" fill="#8b8b9a" font-size="11">.py .js .md</text>

    <rect x="240" y="200" width="130" height="70" rx="12" fill="#161628" stroke="#a855f7"/>
    <text x="305" y="230" fill="#e5e5ef">Chunk +</text>
    <text x="305" y="250" fill="#e5e5ef">Embed</text>

    <rect x="420" y="200" width="130" height="70" rx="12" fill="#161628" stroke="#06b6d4"/>
    <text x="485" y="230" fill="#e5e5ef">Vector DB</text>
    <text x="485" y="250" fill="#8b8b9a" font-size="11">top-k search</text>

    <rect x="600" y="200" width="130" height="70" rx="12" fill="#161628" stroke="#ec4899"/>
    <text x="665" y="230" fill="#e5e5ef">LLM</text>
    <text x="665" y="250" fill="#8b8b9a" font-size="11">grounded ans</text>
  </g>
  <!-- arrows -->
  <g stroke="#8b8b9a" stroke-width="2" fill="none">
    <line x1="190" y1="235" x2="240" y2="235" marker-end="url(#gs-arrow)"/>
    <line x1="370" y1="235" x2="420" y2="235" marker-end="url(#gs-arrow)"/>
    <line x1="550" y1="235" x2="600" y2="235" marker-end="url(#gs-arrow)"/>
  </g>
  <defs>
    <marker id="gs-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b8b9a"/>
    </marker>
  </defs>
  <text x="400" y="470" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b8b9a">repo → chunks → vectors → answer</text>
</svg>
